[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llm_alignment_engine"
version = "2.0.0"
description = "Enterprise Post-RLHF Alignment Engine featuring KTO, Constitutional AI, and Latent Red-Teaming."
authors = [{ name = "Masthan Shaik", email = "masthan@example.com" }]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.31.0",
    "deepspeed>=0.10.0",
    "numpy>=1.24.0",
    "pydantic>=2.0.0"
]

[project.optional-dependencies]
dev = ["black", "pytest"]
